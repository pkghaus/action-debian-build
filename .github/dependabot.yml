version: 2

updates:
  # Every `uses:` here is first-party on a major tag, deliberately, so this
  # entry is what keeps those tags current. The two linters ARE pinned, by
  # digest, but they sit inside `run:` blocks this ecosystem does not read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
