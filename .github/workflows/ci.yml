name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs are worth running for this change. The six container builds are
  # 337-405s each and about 40 minutes of runner time between them; a CHANGELOG
  # edit cannot affect them. Roughly a quarter of commits here touch nothing but
  # markdown.
  #
  # A job-level `if` rather than `paths-ignore` on the workflow: paths-ignore
  # skips the whole run, producing no check at all, which leaves a required
  # status check pending forever if one is ever added. A skipped job reports a
  # conclusion and satisfies it. Plain git rather than a paths-filter action,
  # because every `uses:` here is first-party and one small diff is not worth
  # changing that.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: classify
        # Every branch that cannot answer confidently answers "code", so an
        # unexpected event shape runs the full suite rather than skipping it.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -eu

          run_everything() {
              echo "$1; running everything"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
          }

          # A new branch, a force push or a first push reports an all-zero base.
          case "${BASE:-}" in
              ''|0000000000000000000000000000000000000000)
                  run_everything "no usable base commit" ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null \
              || run_everything "base $BASE is not in this clone"

          changed="$(git diff --name-only "$BASE" "$HEAD")"
          [ -n "$changed" ] || run_everything "no files changed"

          echo "changed:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Counted, not `grep -q`. With -q grep exits on its first match and
          # the upstream printf takes SIGPIPE; under pipefail that makes the
          # pipeline fail and a code change read as documentation. It depends
          # on whether printf finished writing first, so it is a race, and the
          # wrong answer is the dangerous one: tests skipped on a real change.
          total=$(printf '%s\n' "$changed" | grep -c '')
          docs=$(printf '%s\n' "$changed" | grep -cE '\.md$|^LICENSE$' || true)

          if [ "$total" -eq "$docs" ]; then
              echo "documentation only: $docs of $total files"
              echo "code=false" >> "$GITHUB_OUTPUT"
          else
              echo "touches code: $((total - docs)) of $total files"
              echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: shellcheck
        # Pinned by digest rather than taken from the runner image, matching
        # pkghaus/apt and pkghaus/signed-commit. Its shellcheck moves on its own
        # schedule and the info-level checks differ between versions, so a lint
        # that passes locally and fails in CI for no reason anyone changed is
        # worse than a slightly stale linter. The image is distroless, so a
        # `source`d path that exists only at runtime has to be marked in the
        # script rather than resolved here.
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x entrypoint.sh tests/lib.sh tests/run.sh tests/test-*.sh tests/fake-git tests/fake-curl

      - name: actionlint
        # Pinned by digest for the same reason the actions are pinned by SHA.
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: Reject duplicate YAML keys
        run: python3 tests/yamlcheck.py .github/workflows/*.yml action.yml

      - name: shellcheck the composite action's run blocks
        # actionlint shellchecks run blocks, but only in .github/workflows.
        # action.yml's steps are shell too, and the longer half of this action.
        # Same pinned checker as the step above, so every line of shell in this
        # repository is judged by one version.
        env:
          SHELLCHECK: >-
            docker run --rm --volume ${{ github.workspace }}:/repo --workdir /repo
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        run: python3 tests/shellcheck-composite.py action.yml

  test:
    name: test / ${{ matrix.suite }} / ${{ matrix.target.arch }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, testing, unstable]
        target:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the builder image
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker build \
            --build-arg "SUITE=$SUITE" \
            --tag "builder:$SUITE" \
            .

      - name: Run the test suite
        env:
          SUITE: ${{ matrix.suite }}
        run: tests/run.sh "builder:$SUITE"

  action:
    name: action / ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, testing, unstable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the builder image under the tag the action will ask for
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker build \
            --build-arg "SUITE=$SUITE" \
            --tag "local/deb-builder:$SUITE" \
            .

      - name: Prepare the fixture's upstream repository
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm \
            --volume "$PWD/tests/fixture:/target" \
            --workdir /target/upstream \
            --entrypoint sh \
            "local/deb-builder:$SUITE" -c '
              set -eu
              git config --global --add safe.directory /target/upstream
              git init -q -b main .
              git add -A
              git -c user.name=fixture -c user.email=fixture@example.net \
                  commit -qm "fixture upstream"
              git tag v0.0.1
            '

      # The action's own container clones the fixture over file://, and that
      # source tree belongs to the runner user while the clone runs as root.
      # Handing the tree to root beforehand keeps the action itself free of
      # test-only knobs; runner VMs are ephemeral, so root-owned workspace
      # files cost nothing afterwards.
      - name: Hand the fixture to root
        run: sudo chown -R 0:0 tests/fixture/upstream

      # The action under test, exercised exactly as a consumer would use it.
      - name: Build via the action
        uses: ./
        with:
          SUITE: ${{ matrix.suite }}
          IMAGE: local/deb-builder
          WORKING_DIRECTORY: tests/fixture

      - name: Assert the action produced a package
        env:
          SUITE: ${{ matrix.suite }}
        # Mirrors the entrypoint's version qualifier, as tests/test-build.sh
        # does: the suite lives in the version, not the filename.
        run: |
          case "$SUITE" in
              unstable) qualifier="" ;;
              testing)  qualifier="~testing1" ;;
              *)        qualifier="~haus$(docker run --rm --entrypoint sh \
                            "local/deb-builder:$SUITE" \
                            -c '. /etc/os-release && printf %s "$VERSION_ID"')+1" ;;
          esac
          arch="$(dpkg --print-architecture)"
          expected="deb-build-fixture_0.0.1-1${qualifier}_${arch}.deb"

          [ -f "tests/fixture/debs/$expected" ] || {
              echo "expected $expected, found:" >&2
              find tests/fixture/target -type f >&2
              exit 1
          }
          echo "ok: $expected"
