name: Build Debian packages

# Reusable validation pipeline for Debian packaging repositories. A caller
# triggers on tags or pull requests and delegates here; see README.md.
#
# Every matrix leg builds one suite on one architecture and uploads its .deb as
# a short-lived artifact for inspection. Nothing is published from here: the
# pkg.haus APT archive builds its packages from source itself, so this workflow
# exists to prove a packaging repository's tags build cleanly everywhere before
# the archive picks them up.
#
# The build step calls this repository's own action. `uses: ./` would not work
# here, because inside a reusable workflow it resolves against the *caller's*
# checkout, so the reference is by tag. That was rejected once, when no tag
# existed yet and the step was six lines of `docker run`; v1 has existed since
# 2026-08-15 and the step now also runs DEP-8, so duplicating it would mean
# maintaining the same logic in two places and leaving our own published action
# with no consumer inside the org.
#
# Actions are pinned to commit SHAs: a full-length SHA is the only immutable
# reference GitHub offers, and a tag can be moved by anyone who compromises the
# action's repository. Dependabot keeps the pins current.

on:
  workflow_call:
    inputs:
      image:
        description: Builder image, without the suite tag.
        type: string
        default: ghcr.io/pkghaus/deb-builder
      suites:
        description: JSON array of Debian suites to build for.
        type: string
        default: '["trixie","testing","unstable"]'
      targets:
        description: >
          JSON array of {arch, runner} objects. Each entry builds on the given
          runner; the package architecture itself comes from debian/control.
          Passed as objects rather than relying on matrix include, because an
          include entry matching no combination adds a job instead of decorating
          one.
        type: string
        default: >
          [{"arch":"amd64","runner":"ubuntu-24.04"},
           {"arch":"arm64","runner":"ubuntu-24.04-arm"}]
      working_directory:
        description: >
          Directory holding package.conf and debian/, relative to the checkout.
          Defaults to the repository root, which is the shape every
          single-package repository has. A repository holding several packages
          passes the one to build.
        type: string
        default: "."
      dep8:
        description: >
          Run each package's DEP-8 tests after building it, when it ships
          debian/tests/. "on" or "off". A repository carrying debian/tests/ for
          Debian's own CI that does not want them run here sets this to "off".
        type: string
        default: "on"
    secrets:
      APT_DISPATCH_TOKEN:
        description: >
          Fine-grained token allowed to fire repository_dispatch on
          pkghaus/apt. Optional: without it the notify job is a no-op, so
          third-party callers are unaffected.
        required: false

permissions:
  contents: read

concurrency:
  # working_directory is in the key because it is what makes two legs of one
  # matrix different. Without it every package in a multi-package run shares a
  # group, and cancel-in-progress means each cancels the one before: a pull
  # request touching 25 packages verified exactly one of them, green, with the
  # other 24 reading "cancelled" where nobody looks. Invisible until the first
  # such pull request, because every earlier one touched a single package.
  group: build-${{ github.repository }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.suite }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      # One suite failing should not hide the state of the others.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v7
        with:
          # This checkout is mounted into a container that then runs upstream
          # build code -- debian/rules, upstream makefiles, cargo build scripts.
          # A persisted token would sit in .git/config where any of it could
          # read it. Nothing here needs git credentials: the upstream clone is
          # unauthenticated.
          persist-credentials: false

      - name: Build and test package
        # First-party, so a tag rather than a SHA, and it has to be the major:
        # `uses: ./` in a reusable workflow resolves against the caller's
        # checkout, not this repository, and `uses:` takes no expression, so
        # there is no way to name this commit. A caller on build.yml@v1 gets the
        # matching action, since both move together. A caller on an exact tag
        # gets this file frozen and the action still tracking v1, which the
        # README's Versioning section states rather than glosses over.
        uses: pkghaus/action-debian-build@v1
        with:
          IMAGE: ${{ inputs.image }}
          SUITE: ${{ matrix.suite }}
          DEP8: ${{ inputs.dep8 }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          # The directory is part of the name because a caller building several
          # packages in one run would otherwise upload the same name twice, and
          # upload-artifact rejects that. A single-package caller passes "." and
          # keeps the name it has always had.
          # Inverted on purpose. In a GitHub expression `a && b || c` yields c
          # whenever b is falsy, and '' is falsy, so the obvious spelling
          # (wd == '.' && '' || format(...)) gives every existing caller
          # deb-.-trixie-amd64. The non-empty branch has to be in the middle.
          name: deb-${{ inputs.working_directory != '.' && format('{0}-', inputs.working_directory) || '' }}${{ matrix.suite }}-${{ matrix.target.arch }}
          # .deb plus its .buildinfo, for inspection only -- the archive builds
          # its own copies from source.
          path: ${{ inputs.working_directory }}/debs/*
          if-no-files-found: error
          retention-days: 7

  notify-archive:
    # A validated tag is the archive's cue to ingest immediately, instead of
    # the archive polling. Skips silently when the caller provides no
    # APT_DISPATCH_TOKEN (third-party use); fails loudly when the token exists
    # but the dispatch is rejected, so an expired token surfaces as a red run
    # on the very tag it affected.
    name: notify archive
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the ingest
        env:
          TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "APT_DISPATCH_TOKEN not provided; not notifying the archive."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pkghaus/apt/dispatches \
            -d "{\"event_type\":\"package-tagged\",\"client_payload\":{\"repository\":\"${REPOSITORY}\",\"tag\":\"${TAG}\"}}"

