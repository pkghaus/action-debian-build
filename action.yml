---
name: action-debian-build
description: Build a Debian package from an upstream git tag and your own debian/ directory
author: pkg.haus
branding:
  icon: package
  color: red
inputs:
  SUITE:
    description: Debian suite to build for. Selects the builder image tag.
    required: false
    default: trixie
  IMAGE:
    description: Builder image, without the suite tag.
    required: false
    default: ghcr.io/pkghaus/deb-builder
  WORKING_DIRECTORY:
    description: Directory containing debian/ and package.conf, relative to the workspace.
    required: false
    default: .
  DEP8:
    description: >
      Run the package's DEP-8 tests after building it, when it ships
      debian/tests/. "on" or "off".
    required: false
    default: "on"
runs:
  # A composite action rather than the docker action used by action-forge-publish:
  # runs.image takes only static values, so a docker action could neither select
  # the image per suite nor receive SUITE as a build argument.
  using: composite
  steps:
    - name: Build Debian package
      shell: bash
      env:
        IMAGE: ${{ inputs.IMAGE }}
        SUITE: ${{ inputs.SUITE }}
        WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
      run: |
        set -euo pipefail

        # Resolve the tag to a digest and build from that, rather than running
        # the tag directly. `:<suite>` moves whenever the image is rebuilt, so a
        # tag records which image was *meant*, never which one was used, and a
        # build is unauditable afterwards. Resolving here puts the answer in the
        # log and makes the run itself immutable.
        #
        # Resolved rather than hardcoded: pinning a digest in this file would
        # mean cutting an action release for every image rebuild, and consumers
        # pin this action at @v1.
        # Both of these are allowed to fail, and a local image makes both fail.
        # An image built on the runner and never pushed cannot be pulled at all
        # (`pull access denied`) and has no RepoDigests to inspect. That is the
        # shape this repository's own `action /` jobs use, and a fork building
        # its own builder does the same, so neither is an error. If the image is
        # genuinely absent, `docker run` below says so plainly.
        docker pull --quiet "${IMAGE}:${SUITE}" >/dev/null 2>&1 || true
        digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' \
            "${IMAGE}:${SUITE}" 2>/dev/null || true)"
        if [ -n "${digest}" ]; then
            echo "builder image: ${digest}"
            ref="${digest}"
        else
            echo "builder image: ${IMAGE}:${SUITE} (no digest; not from a registry)"
            ref="${IMAGE}:${SUITE}"
        fi

        docker run --rm \
          --volume "${GITHUB_WORKSPACE}/${WORKING_DIRECTORY}:/target" \
          --workdir /target \
          "${ref}"

    - name: Run DEP-8 tests
      shell: bash
      env:
        DEP8: ${{ inputs.DEP8 }}
        SUITE: ${{ inputs.SUITE }}
        WORKING_DIRECTORY: ${{ inputs.WORKING_DIRECTORY }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}/${WORKING_DIRECTORY}"

        # Validated rather than treated as truthy, so a typo is a failure and
        # not a silent skip of the gate. Same shape as LINTIAN in entrypoint.sh.
        case "${DEP8}" in
            on) ;;
            off)
                echo "DEP8=off, not running DEP-8 tests"
                exit 0
                ;;
            *)
                echo "FATAL: unknown DEP8 '${DEP8}' (expected 'on' or 'off')" >&2
                exit 1
                ;;
        esac

        # Absence is not a failure. Most of the fleet ships no debian/tests/
        # yet; the packaging-metadata checklist adds one to each package on its
        # next revision, and this starts running it the moment it lands.
        if [ ! -f debian/tests/control ]; then
            echo "no debian/tests/control, nothing to run"
            exit 0
        fi

        extra_dir=""
        extra_debs=""
        if [ -f package.conf ]; then
            extra_debs="$(sh -c '. ./package.conf >/dev/null 2>&1; printf "%s" "${DEP8_EXTRA_DEBS:-}"')"
        fi
        case "${extra_debs}" in
            "") ;;
            *[!a-z0-9.+\ -]*)
                echo "FATAL: DEP8_EXTRA_DEBS is not a list of Debian package names: '${extra_debs}'" >&2
                exit 1
                ;;
        esac

        # iproute2 explicitly: autopkgtest's docker backend shells out to `ip`
        # but only Recommends it, so --no-install-recommends drops it. Runner
        # images happen to carry it, which would hide the omission until one
        # stopped.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends autopkgtest iproute2

        # This runs on the runner rather than inside the builder image, and it
        # has to. autopkgtest grants the isolation-container capability only
        # when the testbed runs a real init, and it refuses to let the null
        # backend claim it at all: VirtSubproc asserts the scratch directory is
        # not visible to the host, which for the null backend it always is. A
        # test marked isolation-container therefore SKIPs on every backend
        # reachable from inside a container. debian:$SUITE carries no init, so
        # build a testbed with the smallest one autopkgtest accepts.
        testbed="$(mktemp -d)"
        {
            echo "FROM debian:${SUITE}"
            echo "RUN apt-get update && apt-get install -y --no-install-recommends sysvinit-core && rm -rf /var/lib/apt/lists/*"
        } > "${testbed}/Dockerfile"
        docker build -q -t "dep8-testbed:${SUITE}" "${testbed}"

        # A package in this archive can depend on another one: betterlockscreen
        # needs i3lock-color, which Debian does not carry. The testbed has
        # Debian and the package under test and nothing else, so a dependency
        # like that has to be handed to autopkgtest alongside it.
        #
        # It deliberately does NOT come from adding the archive as an apt source
        # inside the testbed. Reaching it over HTTPS would put ca-certificates
        # in every testbed, and a testbed WITHOUT ca-certificates is what
        # catches a package that speaks TLS and forgot to declare it -- which
        # has happened here, and shipped.
        #
        # autopkgtest pins the debs it is given at priority 1002, so a package
        # named here can never shadow the one just built.
        if [ -n "${extra_debs}" ]; then
            extra_dir="$(mktemp -d)"
            docker run --rm --volume "${extra_dir}:/out" "debian:${SUITE}" sh -ec "
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
                curl -fsSL -o /usr/share/keyrings/pkghaus-archive-keyring.gpg \
                    https://apt.pkg.haus/pkghaus-archive-keyring.gpg
                echo 'deb [signed-by=/usr/share/keyrings/pkghaus-archive-keyring.gpg] https://apt.pkg.haus ${SUITE} main' \
                    > /etc/apt/sources.list.d/pkghaus.list
                apt-get update -qq
                cd /out && apt-get download ${extra_debs}
            "
            extra_list=("${extra_dir}"/*.deb)
            if [ ! -e "${extra_list[0]}" ]; then
                echo "FATAL: DEP8_EXTRA_DEBS='${extra_debs}' fetched nothing" >&2
                exit 1
            fi
            # The container writes as root, so these land root-owned on the
            # host -- apt says so itself, refusing to drop to _apt because it
            # cannot access the bind mount. autopkgtest then runs as the runner
            # user and hard-links each deb into its output directory, and under
            # fs.protected_hardlinks=1, which GitHub runners set, you may not
            # link a file you do not own. It fails as a bare EPERM traceback
            # from os.link that names neither ownership nor the sysctl.
            sudo chown "$(id -u):$(id -g)" "${extra_dir}" "${extra_list[@]}"
            echo "DEP8_EXTRA_DEBS fetched for the testbed: ${extra_list[*]##*/}"
        fi

        dep8_debs=(debs/*.deb)
        if [ -n "${extra_dir}" ]; then
            dep8_debs+=("${extra_list[@]}")
        fi

        # --setup-commands because debian:* images carry no apt lists, and the
        # testbed needs them to resolve the package's own Depends.
        summary="$(mktemp)"
        dep8_run() {
            autopkgtest \
                --summary-file "${summary}" \
                --setup-commands 'apt-get update -qq' \
                "${dep8_debs[@]}" . \
                -- docker --init "dep8-testbed:${SUITE}"
        }

        # One retry. A functional test can fail on timing in a way a compile
        # cannot: croc's starts a relay, waits for it to listen, and moves 8 MiB
        # through it. A real breakage fails both times.
        rc=0
        dep8_run || rc=$?
        if [ "${rc}" -ne 0 ]; then
            echo "::warning::DEP-8 run failed (exit ${rc}), retrying once"
            rc=0
            dep8_run || rc=$?
        fi

        cat "${summary}"

        # A skipped test is not a passing one. autopkgtest does exit non-zero
        # when anything skips, but the verdicts are asserted directly as well,
        # so the gate does not depend on that exit table staying as it is.
        if [ "${rc}" -ne 0 ]; then
            echo "FATAL: autopkgtest exited ${rc}" >&2
            exit 1
        fi
        if [ ! -s "${summary}" ]; then
            echo "FATAL: autopkgtest recorded no verdicts" >&2
            exit 1
        fi
        awk '$2 != "PASS" { print "FATAL: not a pass: " $0 > "/dev/stderr"; bad = 1 }
             END { exit bad + 0 }' "${summary}"
